name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8
        ports: [ "3306:3306" ]                 # services -> no ${{ }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        # check MySQL service health
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD | grep 'mysqld is alive'"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DATABASE_URL: "mysql+pymysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?charset=utf8mb4"
      APP_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          sudo apt-get update && sudo apt-get install -y mysql-client curl

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            mysqladmin ping -h ${DB_HOST:-127.0.0.1} -P ${DB_PORT} -u${DB_USER} -p"${DB_PASSWORD}" --silent && break
            sleep 2
          done

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: alembic upgrade head

      # run API server
      - name: Start API server (background)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: ${{ env.APP_PORT }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port ${PORT} > server.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 1
          echo "Uvicorn PID: $(cat uvicorn.pid)"

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/healthz" > /dev/null; then
              echo "API is ready"; exit 0
            fi
            sleep 2
          done
          echo "API not ready in time"; echo "---- tail server.log ----"; tail -n 200 server.log; exit 1

      - name: Run pytest with JUnit report
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest -q --junitxml=pytest.xml

      - name: Stop API server & show logs
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then kill -9 $(cat uvicorn.pid) || true; fi
          echo "---- last 200 lines of server.log ----"
          if [ -f server.log ]; then tail -n 200 server.log || true; fi

      - name: Upload artifacts (report & logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            pytest.xml
            server.log