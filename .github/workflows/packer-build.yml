name: packer-build
on:
  push:
    branches: [ main ]

jobs:
  build-ami:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 建立 out/artifact.zip，確保 packer 有要打包的檔案
      - name: Build artifact.zip
        run: |
          pip install -r requirements.txt
          mkdir -p out
          zip -r out/artifact.zip app alembic alembic.ini requirements.txt start.sh

      # 安裝 Packer CLI
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      # 使用 Access Key 登入 AWS（DEV 帳號）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 初始化並驗證 Packer 設定
      - name: Packer init/validate
        working-directory: packer
        run: |
          packer init .
          packer validate \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "app_artifact=${{ github.workspace }}/out/artifact.zip" \
            mysql-ami.pkr.hcl

            # 建立 AMI (DEV)
      - name: Packer build
        id: packer
        working-directory: packer
        run: |
          # 用 machine-readable 讓 log 好解析
          packer build -machine-readable \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "app_artifact=${{ github.workspace }}/out/artifact.zip" \
            -var "db_name=${{ secrets.DB_NAME }}" \
            -var "db_user=${{ secrets.DB_USER }}" \
            mysql-ami.pkr.hcl | tee build.log

          echo "===== PACKER LOG (last lines) ====="
          tail -n 20 build.log

          # 從 machine-readable log 抓出 AMI ID
          # 典型格式：
          # 1592865879,amazon-ebs,artifact,0,id,us-east-1:ami-1234567890abcdef
          AMI_ID=$(grep ',artifact,0,id,' build.log | tail -n 1 | cut -d, -f6 | cut -d: -f2)

          if [ -z "$AMI_ID" ]; then
            echo "ERROR: Failed to parse AMI ID from packer log"
            exit 1
          fi

          echo "Built AMI: $AMI_ID"

          # 輸出給後續 steps 使用
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      #   Share AMI to DEMO account
        - name: Share AMI with Demo account
          run: |
            aws ec2 modify-image-attribute \
              --image-id "${{ steps.packer.outputs.ami_id }}" \
              --launch-permission "Add=[{UserId=${{ secrets.DEMO_ACCOUNT_ID }}}]"


      #   Switch AWS credentials → DEMO
      - name: Configure AWS credentials (DEMO)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      #   Create new Launch Template version
      - name: Create Launch Template Version
        id: lt
        run: |
          LT_ID="${{ secrets.LAUNCH_TEMPLATE_ID }}"
          AMI="${{ steps.packer.outputs.ami_id }}"

          echo "Updating Launch Template $LT_ID to AMI $AMI"

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LT_ID" \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"$AMI\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "New Launch Template version: $NEW_VERSION"
          echo "LT_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          aws ec2 modify-launch-template \
            --launch-template-id "$LT_ID" \
            --default-version "$NEW_VERSION"

      #   Start ASG Instance Refresh
      - name: Start Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
            --preferences MinHealthyPercentage=90,InstanceWarmup=300 \
            --query 'InstanceRefreshId' \
            --output text)

          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "Started instance refresh: $REFRESH_ID"

      #   Wait for refresh to complete
      - name: Wait for instance refresh
        run: |
          ASG="${{ secrets.ASG_NAME }}"
          REFRESH="${{ steps.refresh.outputs.REFRESH_ID }}"

          echo "Waiting for instance refresh..."

          for i in {1..60}; do   # 最多等 30 分鐘
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG" \
              --instance-refresh-ids "$REFRESH" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance refresh completed successfully."
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance refresh FAILED: $STATUS"
              exit 1
            fi

            sleep 30
          done

          echo "Timeout waiting for instance refresh."
          exit 1
