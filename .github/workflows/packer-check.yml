name: packer-check
on:
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3

      # check format : if modified -> fail
      - name: packer fmt (and fail if it changed files)
        working-directory: packer
        run: |
          packer fmt -recursive . && test -z "$(git status --porcelain)" || (git --no-pager diff && exit 1)

      # 產生假的 artifact.zip，讓 validate 不報錯
      - name: Create dummy artifact for validate
        run: |
          mkdir -p out
          echo "placeholder" > out/placeholder.txt
          zip -q -j out/artifact.zip out/placeholder.txt

      # initialize Packer plugin
      - name: packer init
        working-directory: packer
        run: packer init .

      # 用假變數 validate（不用 secrets）
      - name: packer validate (no secrets)
        working-directory: packer
        run: |
          packer validate \
            -var "region=us-east-1" \
            -var "demo_account_id=111111111111" \
            -var "app_artifact=${{ github.workspace }}/out/artifact.zip" \
            -var "db_pass=example-password" \
            mysql-ami.pkr.hcl
